<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/supabase-config.js"></script>
<script>if (window.SUPABASE_URL && window.SUPABASE_ANON_KEY) { window.supabase = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY); }</script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/main.js"></script>
<script>
(function() {
  // If logged in, pre-fill name/email (read-only). Guests can book freely.
  if (window.supabase && window.supabase.auth) {
    window.supabase.auth.getSession().then(function(r) {
      var user = r.data && r.data.session && r.data.session.user;
      if (user) {
        var emailEl = document.getElementById('booking-email');
        var nameEl = document.getElementById('booking-name');
        if (emailEl) { emailEl.value = user.email || ''; emailEl.readOnly = true; }
        if (nameEl && user.user_metadata && user.user_metadata.full_name) { nameEl.value = user.user_metadata.full_name; }
      }
    });
  }
  var MONTHS_BG = (window.i18n && window.i18n.getMonths) ? window.i18n.getMonths() : ['Януари','Февруари','Март','Април','Май','Юни','Юли','Август','Септември','Октомври','Ноември','Декември'];
  var DAYS_BG = (window.i18n && window.i18n.getDays) ? window.i18n.getDays() : ['Нд','Пн','Вт','Ср','Чт','Пт','Сб'];
  var today = new Date();
  today.setHours(0,0,0,0);

  var viewYear = today.getFullYear();
  var viewMonth = today.getMonth();
  var selectedDate = null;
  var selectedTime = null;
  var consultantId = 'georgi_grozev';
  var takenSlots = [];
  var now = new Date();

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function dateStr(y,m,d) { return y + '-' + pad(m+1) + '-' + pad(d); }
  function isPast(y,m,d) {
    var d0 = new Date(y,m,d); d0.setHours(0,0,0,0);
    return d0 < today;
  }

  function renderCalendar() {
    var grid = document.getElementById('calendar-grid');
    var header = document.getElementById('calendar-month');
    header.textContent = MONTHS_BG[viewMonth] + ' ' + viewYear;

    var first = new Date(viewYear, viewMonth, 1);
    var last = new Date(viewYear, viewMonth + 1, 0);
    var startPad = (first.getDay() + 6) % 7;
    var days = last.getDate();
    var html = '';

    for (var i = 0; i < startPad; i++) html += '<div class="h-10"></div>';
    for (var d = 1; d <= days; d++) {
      var past = isPast(viewYear, viewMonth, d);
      var ds = dateStr(viewYear, viewMonth, d);
      var cls = 'h-10 w-full flex items-center justify-center rounded-lg text-sm font-medium ';
      if (past) {
        cls += 'text-slate-400 cursor-not-allowed';
        html += '<div class="' + cls + '">' + d + '</div>';
      } else {
        cls += 'booking-day hover:bg-primary/10 ';
        if (selectedDate === ds) {
          cls += 'bg-primary text-white font-bold shadow-lg shadow-primary/30';
        } else {
          cls += 'text-slate-800 dark:text-slate-200';
        }
        html += '<button type="button" class="' + cls + '" data-date="' + ds + '">' + d + '</button>';
      }
    }
    grid.innerHTML = html;

    if (!selectedDate) selectedDate = dateStr(today.getFullYear(), today.getMonth(), today.getDate());
    updateDateLabel();
    attachDayListeners();
  }

  function updateDateLabel() {
    var el = document.getElementById('time-slot-date');
    if (!selectedDate) return;
    var p = selectedDate.split('-');
    var d = new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10));
    var dayNames = ['Неделя','Понеделник','Вторник','Сряда','Четвъртък','Петък','Събота'];
    el.textContent = dayNames[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS_BG[d.getMonth()];
  }

  function fetchTakenSlots() {
    if (!selectedDate || !consultantId) return;
    var url = '/api/book/taken?consultant_id=' + encodeURIComponent(consultantId) + '&date=' + encodeURIComponent(selectedDate);
    window.api.get(url).then(function(r) { return r.json(); }).then(function(data) {
      takenSlots = data.taken || [];
      updateTimeSlotsUI();
    }).catch(function() { takenSlots = []; updateTimeSlotsUI(); });
  }

  function updateTimeSlotsUI() {
    document.querySelectorAll('.booking-time').forEach(function(btn) {
      var t = btn.getAttribute('data-time');
      var taken = takenSlots.indexOf(t) >= 0;
      var disabled = taken;
      // Disable past times for today
      if (selectedDate === dateStr(today.getFullYear(), today.getMonth(), today.getDate())) {
        var parts = (t || '').split(':');
        var h = parseInt(parts[0] || '0', 10);
        var m = parseInt(parts[1] || '0', 10);
        var slotMinutes = h * 60 + m;
        var nowMinutes = now.getHours() * 60 + now.getMinutes();
        if (slotMinutes <= nowMinutes) {
          disabled = true;
        }
      }
      btn.disabled = disabled;
      btn.classList.remove('border-2','border-primary','bg-primary/5','text-primary','font-bold','shadow-sm');
      btn.classList.remove('line-through','opacity-60','cursor-not-allowed','bg-slate-100','dark:bg-slate-800');
      if (disabled) {
        btn.classList.add('line-through','opacity-60','cursor-not-allowed','bg-slate-100','dark:bg-slate-800','text-slate-400');
        btn.classList.remove('hover:border-primary','hover:text-primary');
      } else {
        btn.classList.add('border','border-slate-200','dark:border-slate-700','text-slate-700','dark:text-slate-300');
        btn.classList.add('hover:border-primary','hover:text-primary');
      }
      if (disabled && selectedTime === t) selectedTime = null;
    });
    if (selectedTime && takenSlots.indexOf(selectedTime) >= 0) {
      selectedTime = null;
    } else if (selectedTime) {
      var sel = document.querySelector('.booking-time[data-time="' + selectedTime + '"]');
      if (sel && !sel.disabled) {
        sel.classList.add('border-2','border-primary','bg-primary/5','text-primary','font-bold','shadow-sm');
      }
    }
  }

  function attachDayListeners() {
    document.querySelectorAll('.booking-day').forEach(function(btn) {
      btn.addEventListener('click', function() {
        selectedDate = this.getAttribute('data-date');
        renderCalendar();
        fetchTakenSlots();
      });
    });
  }

  document.getElementById('calendar-prev').addEventListener('click', function() {
    viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; }
    renderCalendar();
  });
  document.getElementById('calendar-next').addEventListener('click', function() {
    viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; }
    renderCalendar();
  });

  document.querySelectorAll('.booking-time').forEach(function(btn) {
    btn.addEventListener('click', function() {
      if (this.disabled) return;
      document.querySelectorAll('.booking-time').forEach(function(b) {
        if (!b.disabled) {
          b.classList.remove('border-2','border-primary','bg-primary/5','text-primary','font-bold','shadow-sm');
          b.classList.add('border','border-slate-200','dark:border-slate-700','font-semibold');
        }
      });
      this.classList.add('border-2','border-primary','bg-primary/5','text-primary','font-bold','shadow-sm');
      this.classList.remove('border','font-semibold');
      selectedTime = this.getAttribute('data-time');
    });
  });

  document.querySelectorAll('.consultant-option').forEach(function(btn) {
    btn.addEventListener('click', function() {
      consultantId = this.getAttribute('data-consultant-id');
      document.querySelectorAll('.consultant-option').forEach(function(b) {
        b.classList.remove('border-primary','bg-primary/5');
        b.classList.add('border-slate-200','dark:border-slate-700');
        b.querySelector('.consultant-check').classList.add('opacity-0');
      });
      this.classList.add('border-primary','bg-primary/5');
      this.classList.remove('border-slate-200','dark:border-slate-700');
      this.querySelector('.consultant-check').classList.remove('opacity-0');
      fetchTakenSlots();
    });
  });

  renderCalendar();
  fetchTakenSlots();
  // Preselect the earliest available time that is not taken and not in the past (for today)
  (function() {
    var firstSelectable = null;
    document.querySelectorAll('.booking-time').forEach(function(btn) {
      if (!btn.disabled && !firstSelectable) firstSelectable = btn;
    });
    if (firstSelectable) {
      selectedTime = firstSelectable.getAttribute('data-time');
      firstSelectable.classList.add('border-2','border-primary','bg-primary/5','text-primary','font-bold','shadow-sm');
    }
  })();
  document.querySelector('.consultant-option[data-consultant-id="georgi_grozev"]').classList.add('border-primary','bg-primary/5');
  document.querySelector('.consultant-option[data-consultant-id="georgi_grozev"] .consultant-check').classList.remove('opacity-0');

  // Pre-select consultant from ?consultant= URL param
  (function() {
    var VALID = ['georgi_grozev', 'petya_grozeva', 'irina_panayotova'];
    var param = new URLSearchParams(window.location.search).get('consultant');
    if (param && VALID.indexOf(param) !== -1 && param !== consultantId) {
      document.querySelectorAll('.consultant-option').forEach(function(b) {
        b.classList.remove('border-primary','bg-primary/5');
        var chk = b.querySelector('.consultant-check');
        if (chk) chk.classList.add('opacity-0');
      });
      consultantId = param;
      var target = document.querySelector('.consultant-option[data-consultant-id="' + param + '"]');
      if (target) {
        target.classList.add('border-primary','bg-primary/5');
        var chk = target.querySelector('.consultant-check');
        if (chk) chk.classList.remove('opacity-0');
      }
    }
  })();

  document.getElementById('booking-submit').addEventListener('click', function(e) {
    e.preventDefault();
    if (!window.api || typeof window.api.post !== 'function') {
      alert('Грешка при зареждане. Опреснете страницата.');
      return;
    }
    var name = document.getElementById('booking-name').value.trim();
    var email = document.getElementById('booking-email').value.trim();
    var phone = document.getElementById('booking-phone').value.trim();
    var notes = document.getElementById('booking-notes').value.trim();
    if (!name || !email || !phone) {
      if (typeof showMessage === 'function') showMessage('Моля въведете име, имейл и телефон.', 'error');
      else alert('Моля въведете име, имейл и телефон.');
      return;
    }
    if (!notes) {
      if (typeof showMessage === 'function') showMessage('Моля опишете накратко за какво се отнася консултацията.', 'error');
      else alert('Моля опишете накратко за какво се отнася консултацията.');
      return;
    }
    if (!selectedDate || !selectedTime) {
      if (typeof showMessage === 'function') showMessage('Моля изберете дата и час.', 'error');
      else alert('Моля изберете дата и час.');
      return;
    }
    var btn = this;
    btn.disabled = true;
    btn.textContent = 'Изпращане...';
    var payload = {
      client_name: name,
      client_email: email,
      client_phone: phone,
      consultant_id: consultantId,
      date: selectedDate,
      time: selectedTime,
      service: (document.getElementById('booking-service') || {}).value || 'Кредитна консултация',
      notes: notes
    };
    // Use authenticated endpoint if logged in, guest endpoint otherwise
    var bookingPromise;
    var _isGuest = true;
    if (window.supabase && window.supabase.auth) {
      bookingPromise = window.supabase.auth.getSession().then(function(r) {
        var session = r.data && r.data.session;
        _isGuest = !session;
        var endpoint = session ? '/api/book' : '/api/book/guest';
        return window.api.post(endpoint, payload);
      });
    } else {
      bookingPromise = window.api.post('/api/book/guest', payload);
    }

    bookingPromise
      .then(function(r) {
        return r.text().then(function(t) {
          var d;
          try { d = t ? JSON.parse(t) : {}; } catch (e) { d = {}; }
          return { ok: r.ok, status: r.status, data: d, raw: t };
        });
      })
      .then(function(res) {
        if (res.ok) {
          var names = { georgi_grozev: 'Georgi Grozev', petya_grozeva: 'Petya Grozeva', irina_panayotova: 'Irina Panayotova' };
          sessionStorage.setItem('lastBooking', JSON.stringify({
            consultant_id: consultantId,
            consultant_name: names[consultantId] || consultantId,
            date: selectedDate,
            time: selectedTime,
            booking_id: (res.data && res.data.booking_id) || '',
            is_guest: _isGuest
          }));
          window.location.href = '/booking_confirmed/';
        } else {
          var d = res.data || {};
          var msg = d.detail;
          if (Array.isArray(msg)) msg = msg.map(function(x) { return x.msg || x.loc ? (x.loc + ': ' + (x.msg || '')) : String(x); }).join('. ');
          else if (typeof msg !== 'string') msg = d.message || d.error || (typeof d.detail === 'string' ? d.detail : null) || ('Грешка ' + res.status);
          if (!msg) {
            msg = res.raw ? ('Грешка ' + res.status + ': ' + String(res.raw).slice(0, 300)) : ('Грешка ' + res.status);
          }
          alert(msg);
          btn.disabled = false;
          btn.textContent = 'Потвърди часа';
        }
      })
      .catch(function(err) {
        console.error('Booking error:', err);
        alert('Неуспешно свързване. Проверете интернет и опитайте отново.');
        btn.disabled = false;
        btn.textContent = 'Потвърди часа';
      });
  });
})();
</script>
</body></html>
